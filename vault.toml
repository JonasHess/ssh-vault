# dfm vault configuration. Nothing in this file is secret.

[vault]
owner = "JonasHess"

[dotfiles]
repo = "git@github.com:JonasHess/dotfiles.git"
target = "~/repos/dotfiles"
install = "stow -Sv -d ~/repos/dotfiles -t ~ ."
# Commands the dotfiles need; each is installed with the system package manager when missing.
packages = ["zsh", "fzf", "stow"]

[legacy]
# What "Clean up old keys" looks for on machines set up before dfm.
authorized_keys_comments = ["MainKey"]
private_keys = ["id_rsa_JH_Github"]
